name: CI

on:
  push:
    branches: [main, master, feat/current-protocol-and-upstream-tracking]
  pull_request:
    branches: [main, master, feat/current-protocol-and-upstream-tracking]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22]
        include:
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Full test suite
        run: pnpm test

      # Upstream 1.0.5 is below its own global coverage thresholds (see UPSTREAM.md).
      # Keep the thresholds unchanged and report the gap without hiding test failures.
      - name: Coverage report (known upstream threshold debt)
        continue-on-error: true
        run: pnpm test:coverage

      - name: Build
        run: pnpm build
